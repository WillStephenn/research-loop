# Closed vocabularies for the registry.
#
# Every value a record may carry is listed here. The tools refuse anything not
# in these lists, which is the point: a free-text family field becomes a pile of
# near-synonyms within a fortnight, and a free-text target field lets a
# hypothesis claim it moved something nobody agreed to measure.
#
# Edit this file to point the loop at a new problem. Nothing else needs to
# change.

# Families group hypotheses by the kind of change they propose. Keep the list
# short. A family exists so `hypothesis.sh next` can notice that one angle has
# been attempted twelve times without moving anything, so families that never
# collect several attempts are not earning their place.
HYPOTHESIS_FAMILIES=(
    representation
    objective-mismatch
    optimisation
    capacity
    evaluation-methodology
    data-plumbing
)

# Tasks are obligations rather than conjectures, and they get their own
# families so the two cannot be confused in a count.
TASK_FAMILIES=(
    infrastructure
    tooling
    measurement
)

# Targets are the metrics a hypothesis may claim to move. They must match the
# condition names in your goal file, because the ratchet reads both.
TARGETS=(
    median_error
    frac_worsened
    frac_improved
)

# Ratchet axes: one per numeric threshold the loop may raise, and whether a
# lower number is the harder bar. Anything not listed here is human-owned and
# no tool will write it.
RATCHET_AXES=(
    median_error:harder_is_lower
    frac_worsened:harder_is_lower
    frac_improved:harder_is_higher
)

# Test cost tiers, cheapest first. The ranking prefers the cheapest test that
# could settle a question, so these names carry real weight.
#
#   probe  decidable against artefacts already on disk. Minutes, no exclusive
#          resource, safe to run concurrently with live work.
#   run    books the expensive resource. Hours, and the loop can do nothing
#          else with that resource meanwhile.
TEST_COSTS=(probe run)

# How many times a hypothesis may be attempted before it must be settled or
# retired. A conjecture that survives three honest attempts without a verdict
# is not being tested, it is being protected.
ATTEMPT_CAP=3

# ---------------------------------------------------------------------------
# Scheduling and the heartbeat (bin/schedule_next.sh and bin/tick.sh)
#
# The agent picks when its successor wakes. bin/schedule_next.sh records a due
# time; bin/tick.sh, called every few minutes by cron, launchd or a loop, runs
# the agent only once that time has passed. Every key below except AGENT_CMD has
# a built-in default, so a scratch config that leaves them out still works.

# Bounds on a requested wake, in minutes. A request outside them is clamped,
# not refused. Keep the floor at or above how often you call bin/tick.sh:
# asking for less does not wake the loop sooner, it rounds up to the next call.
SCHEDULE_MIN_MINUTES=15
SCHEDULE_MAX_MINUTES=960
# Used when a tick ends without asking for a wake (it forgot, or it died). A
# tick that died does not get to choose, so its successor arrives on this.
SCHEDULE_DEFAULT_MINUTES=60

# The command that runs one tick. bin/tick.sh runs it under bash from the repo
# root with stdin closed, and exports RL_SESSION_ID, a fresh UUID for the tick.
# Add the permission flags you are comfortable with: a headless agent that
# cannot run commands will just report that and stop.
#   AGENT_CMD='claude -p --session-id "$RL_SESSION_ID" "Read agent/orchestrate.md and follow it"'
AGENT_CMD='claude -p "Read agent/orchestrate.md and follow it"'

# Optional. When a tick dies on a usage limit and its session id is known, the
# next wake runs this instead of AGENT_CMD, with RL_RESUME_SESSION and
# RL_ASLEEP_MINUTES exported. Empty means a dead tick is always restarted fresh.
#   AGENT_RESUME_CMD='claude -p --resume "$RL_RESUME_SESSION" "You were paused for $RL_ASLEEP_MINUTES minutes. Re-check anything volatile, then continue."'
AGENT_RESUME_CMD=''

# A non-zero exit whose output matches this (grep -E, case-insensitive) is
# recorded as a usage-limit death, the one kind worth resuming. Other deaths
# restart fresh, because the dead conversation may itself be the problem.
USAGE_LIMIT_PATTERN='hit your (session|usage) limit|usage limit reached|out of usage credits'
